<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckingOOH - Redirecionando...</title>
  <meta http-equiv="refresh" content="0; url=https://emidiastec.com.br/plataforma-de-controle">
  <link rel="canonical" href="https://emidiastec.com.br/plataforma-de-controle">

  <style>
    :root {
      --emidias-primary: #06055B;
      --emidias-magenta: #FC1E75;
      --emidias-roxo: #AA1EA5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--emidias-primary) 0%, var(--emidias-roxo) 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .redirect-container {
      max-width: 500px;
    }

    .logo {
      max-width: 200px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }

    .manual-link {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    .manual-link a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border: 2px solid white;
      border-radius: 50px;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .manual-link a:hover {
      background: white;
      color: var(--emidias-primary);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }
      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <img src="https://emidiastec.com.br/wp-content/smush-avif/2025/03/logo-E-MIDIAS-png-fundo-escuro-HORIZONTAL.png.avif"
         alt="E-MÍDIAS"
         class="logo"
         onerror="this.src='./LogoEmidias.png'">

    <h1>CheckingOOH</h1>
    <p>Redirecionando para a página da plataforma...</p>

    <div class="spinner"></div>

    <div class="manual-link">
      <p style="font-size: 14px; margin-bottom: 15px;">Se não for redirecionado automaticamente:</p>
      <a href="https://emidiastec.com.br/plataforma-de-controle">Clique aqui</a>
    </div>
  </div>

  <script>
    // Redirecionamento via JavaScript como fallback
    setTimeout(function() {
      window.location.href = 'https://emidiastec.com.br/plataforma-de-controle';
    }, 100);
  </script>
</body>
</html>
