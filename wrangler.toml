name = "checkingooh"
compatibility_date = "2024-10-17"

[env.production.vars]
NODE_ENV = "production"
PROJECT_VERSION = "v3.1-estrutura-corrigida"

[vars]
NODE_ENV = "development"
PROJECT_VERSION = "v3.1-estrutura-corrigida"

# Opcional (Cloudflare Pages → Environment variables):
# GOOGLE_DRIVE_CHECKINGOOH_FOLDER_ID — ID da pasta "CheckingOOH" (URL …/folders/ESTE_ID)
# GOOGLE_DRIVE_SHARED_DRIVE_ID — ID do Drive partilhado (pesquisa CheckingOOH só neste drive)
# CHECKINGOOH_ROOT_FOLDER_ID — alias do ID da pasta raiz CheckingOOH
